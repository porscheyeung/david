.controlbar{background:#fdf8ec;border-radius:21px;box-shadow:0 6px 0 #0003;display:flex;gap:14px;padding:12px 15px;align-items:center;color:var(--ink);min-height:94px}.mission{display:flex;gap:12px;align-items:center;flex:1;min-width:160px}.mission-symbol{height:55px;width:55px;min-width:55px;border-radius:16px;background:linear-gradient(150deg,#d9f0df,#9ed6b8);display:grid;place-items:center;font-size:28px}.mission strong{font-size:clamp(17px,1.5vw,23px);display:block}.mission p{margin:4px 0 0;color:#697982;font-size:clamp(12px,1.15vw,16px);font-weight:700}.ctrl{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.primary,.secondary,.danger,.quiet{border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:900;min-height:50px;box-shadow:0 4px 0 #0002}.primary{background:linear-gradient(180deg,#ffd982,#f4ab42);color:#513b1d}.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}.secondary{background:#d9eceb;color:#2b6466}.danger{background:#f3d0ca;color:#8d3835}.quiet{background:#eff2f1;color:#56616d}.ctrl button:hover{filter:brightness(1.04)}.dpad{display:flex;gap:6px;align-items:center}.dpad button{width:49px;height:50px;border:2px solid #9dc2c6;background:#e1f1ee;border-radius:12px;font-weight:900;font-size:21px;color:#2e666b;touch-action:none;user-select:none;-webkit-user-select:none}.dpad button:active,.dpad button.held{background:#89d2c4;transform:translateY(2px)}.footer{font-size:12px;font-weight:700;color:#a9c3d4;text-align:center;line-height:1.4}

e4e8e3;border:0;color:#416069;border-radius:12px;padding:11px 15px;font-weight:900}.tab.active{background:#3b8d91;color:#fff}.story-line{padding:13px 16px;margin:9px 0;border-radius:13px;background:white;border:1px solid #e5e8dc;font-size:clamp(17px,1.8vw,21px);font-weight:750;line-height:1.65}.story-line.hidden-line{opacity:.25;filter:blur(4px);user-select:none}.teacher-badge{font-size:13px;font-weight:900;color:#377579;background:#dcefed;padding:7px 12px;border-radius:99px;display:inline-block}.q-card{border:2px solid #efd59c;border-radius:18px;background:#fff2d8;padding:18px 22px;margin:14px 0}.q-card strong{font-size:clamp(19px,2vw,25px)}.hint{font-size:clamp(17px,1.7vw,21px);background:#e3f1ed;border-radius:13px;padding:14px 17px;margin-top:10px;color:#315f5b}.control-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.control-list button{text-align:left}.divider{border:0;border-top:2px dashed #dedccf;margin:22px 0}.cornerclose{position:absolute;right:16px;top:16px;width:40px;height:40px;background:#ede8d8;border:none;border-radius:12px;font-size:23px;color:#64727b}.confetti{font-size:46px;letter-spacing:12px}.kbd{display:inline-block;border:2px solid #d8dcd9;border-bottom-width:4px;background:white;border-radius:8px;padding:3px 8px;font-size:.85em;font-weight:900}
@media(max-width:900px){.steps{order:3;width:100%;justify-content:center}.topbar{gap:9px}.brand{min-width:0}.toolbtn{padding:8px 9px;font-size:13px;min-height:42px}.controlbar{flex-wrap:wrap}.ctrl{width:100%}.mission-symbol{width:45px;min-width:45px;height:45px}.app{gap:9px}.stage{border-width:3px;border-radius:15px}.step{padding:7px 9px;font-size:12px}}
@media(max-width:600px){.app{padding:9px 8px 20px}.brand h1{font-size:18px}.brand small{font-size:9px}.brand-icon{width:39px;height:39px}.toolbar{width:100%;justify-content:space-between}.steps{order:4}.stage-tag,.scene-counter{padding:5px 7px;border-radius:8px}.stage-labels{inset:6px 7px auto}.dpad button{height:43px;width:43px}.controlbar{padding:10px}.mission strong{font-size:16px}.mission p{font-size:12px}.primary,.secondary,.danger,.quiet{min-height:45px;font-size:14px;padding:11px 13px}.feature-grid{grid-template-columns:1fr}.modal-inner{padding:22px 17px}.modal{border-width:3px}.overlay{padding:9px}.control-list{grid-template-columns:1fr}.stage{min-height:185px;aspect-ratio:1280/620}.footer{font-size:11px}}

<body>
<div class="app" id="app">
<header class="topbar">
<div class="brand"><div class="brand-icon">✦</div><div><h1>大衛的勇氣挑戰</h1><small>DAVID'S COURAGE · 兒童主日學</small></div></div>
<div class="steps" id="steps" aria-label="遊戲關卡"><span class="step">① 牧羊</span><span class="step">② 石子</span><span class="step">③ 歌利亞</span></div>
<div class="toolbar"><button class="toolbtn story" id="teacherBtn">📖 老師講故事</button><button class="toolbtn" id="soundBtn" aria-label="切換音效">🔊 音效</button><button class="toolbtn" id="fullBtn">⛶ 全螢幕</button></div>
</header>
<section class="stage" id="stageBox" aria-label="遊戲畫面"><canvas id="stage" width="1280" height="620" aria-label="大衛的勇氣挑戰互動場景"></canvas><div class="stage-labels"><div class="stage-tag" id="stageTitle">勇氣從信靠開始</div><div class="scene-counter" id="stageCounter">✦ 聖經冒險</div></div><div class="toast" id="toast" role="status" aria-live="polite"></div></section>
<section class="controlbar"><div class="mission"><span class="mission-symbol" id="missionIcon">🌟</span><div><strong id="missionTitle">一同踏上聖經冒險</strong><p id="missionDetail">選擇難度，準備開始。</p></div></div><div class="ctrl" id="controls"><button class="primary" data-control="start">開始冒險 ➜</button></div></section>
<footer class="footer">單一 HTML · 可離線使用 · 建議以 16:9 螢幕進行 · 故事取材自《撒母耳記上》第 17 章</footer>
</div>
<div id="modalRoot"></div>
<script>
(()=>{'use strict';
const W=1280,H=620,canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),root=document.getElementById('modalRoot'),els={stage:document.getElementById('stageBox'),title:document.getElementById('stageTitle'),count:document.getElementById('stageCounter'),micon:document.getElementById('missionIcon'),mtitle:document.getElementById('missionTitle'),mdetail:document.getElementById('missionDetail'),controls:document.getElementById('controls'),steps:document.getElementById('steps'),teacher:document.getElementById('teacherBtn'),sound:document.getElementById('soundBtn'),full:document.getElementById('fullBtn'),toast:document.getElementById('toast')};
const S={screen:'menu',level:0,difficulty:'easy',sound:true,modal:null,gameTime:0,lastFrame:0,toastUntil:0,toastText:'',toastBad:false,keys:new Set(),touchDirs:new Set(),sheep:[],rescued:0,player:{x:146,y:353},goal:null, hazardCooldown:0,pendingCompletion:0,stoneList:[],collected:0,flight:[],timing:{phase:'practice',pos:.07,dir:1,misses:0,assist:false,lockedUntil:0,animation:null,practiceSuccess:false},winConfetti:0};
const story={1:{ref:'撒母耳記上 17:34–37',topic:'記得上帝的幫助',lines:['大衛從前是一位牧羊人，負責照顧父親的羊。','當獅子或熊來捉羊時，大衛會勇敢地保護羊群。','大衛回想過去的經歷，相信上帝也能在面對歌利亞時幫助他。'],question:'當你遇到害怕的事情時，可以想起甚麼？',answer:'可以回想過去曾得到的幫助，也可以禱告，並向可信任的大人求助。'},2:{ref:'撒母耳記上 17:38–40',topic:'作好準備，勇敢前行',lines:['掃羅讓大衛試穿自己的盔甲，但大衛不習慣穿著它行動。','大衛脫下盔甲，帶著牧杖、機弦和牧人袋子。','他從溪中選取五塊光滑的石子，準備面對歌利亞。'],question:'大衛為甚麼沒有穿著掃羅的盔甲？',answer:'因為他不習慣穿著那套盔甲。他按自己熟悉的方式準備，更重要的是他信靠上帝。'},3:{ref:'撒母耳記上 17:45–50',topic:'勇氣來自信靠上帝',lines:['歌利亞身材高大，拿著武器，向以色列人挑戰。','大衛向歌利亞表明，他是倚靠萬軍之耶和華的名迎戰。','大衛用機弦甩出一塊石子，擊中歌利亞的額頭，歌利亞就倒下了。'],question:'大衛面對比自己強大的歌利亞，他信靠的是誰？',answer:'他信靠上帝。這個故事不是說技巧夠好就一定能贏，而是讓我們認識大衛的信心與勇氣。'}};
let audioCtx=null,toastTimeout=null;
function sound(kind){if(!S.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const map={tap:[540,.07],good:[720,.13],wrong:[200,.17],win:[880,.30],fire:[390,.22]};let [freq,dur]=map[kind]||map.tap;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind==='wrong'?'sine':'triangle';o.frequency.setValueAtTime(freq,audioCtx.currentTime);if(kind==='win')o.frequency.exponentialRampToValueAtTime(freq*1.5,audioCtx.currentTime+dur);if(kind==='fire')o.frequency.exponentialRampToValueAtTime(125,audioCtx.currentTime+dur);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.095,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02)}catch(e){}}
function showToast(msg,bad=false){S.toastText=msg;S.toastBad=bad;els.toast.textContent=msg;els.toast.className='toast show'+(bad?' bad':'');if(toastTimeout)clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>els.toast.classList.remove('show'),1800)}
function chooseDifficulty(v){S.difficulty=v;renderModal()}
function updateUI(){const isPlay=S.screen==='playing',level=S.level,chapter=isPlay?level:0;els.steps.innerHTML=[1,2,3].map((n)=>`<span class="step ${chapter===n?'active':(chapter>n||S.screen==='ending')?'done':''}">${['','① 牧羊','② 石子','③ 歌利亞'][n]}</span>`).join('');els.teacher.disabled=!isPlay||!!S.modal;els.title.textContent=!isPlay?'勇氣從信靠開始':(['','第一關 · 牧羊人的回憶','第二關 · 出戰前的準備','第三關 · 勇敢面對歌利亞'][level]);let a={icon:'🌟',title:'一同踏上聖經冒險',detail:'老師主持、全班參與，約 12–15 分鐘。',count:'✦ 聖經冒險',buttons:'<button class="primary" data-control="start">開始冒險 ➜</button>'};
if(isPlay&&level===1)a={icon:'🐑',title:'引導小羊回羊圈',detail:'點選草地移動，或按方向鍵／下方按鈕。',count:`🐑 已救援 ${S.rescued} / ${S.sheep.length}`,buttons:'<div class="dpad" aria-label="移動方向"><button data-dir="left" aria-label="向左移動">◀</button><button data-dir="up" aria-label="向上移動">▲</button><button data-dir="down" aria-label="向下移動">▼</button><button data-dir="right" aria-label="向右移動">▶</button></div>'};
if(isPlay&&level===2)a={icon:'🪨',title:'找到五塊光滑的石子',detail:'在溪流中點擊圓滑石子，避免尖角石子。',count:`🪨 已收集 ${S.collected} / 5`,buttons:'<button class="secondary" data-control="stone-hint">🔎 觀察提示</button>'};
if(isPlay&&level===3){let t=S.timing;a={icon:'🎯',title:t.phase==='practice'?'先練習掌握發射時機':'留意時機，勇敢面對挑戰',detail:t.phase==='practice'?'綠色範圍內按「發射」，先擊中木靶。':'只有掌握時機後才會進入故事的發射動畫。',count:t.phase==='practice'?'🎯 練習模式':'✦ 正式挑戰',buttons:`${(t.misses>=2&&!t.assist)?'<button class="secondary" data-control="assist">💡 開啟協助</button>':''}<button class="primary" id="fireBtn" data-control="fire" ${t.animation?'disabled':''}>🎯 發射！〈空白鍵〉</button>`}}
if(S.screen==='ending')a={icon:'✨',title:'你完成了大衛的勇氣挑戰！',detail:'信靠上帝，也學習勇敢面對生活中的困難。',count:'🏆 故事完成',buttons:'<button class="primary" data-control="restart">再玩一次 ↻</button>'};els.micon.textContent=a.icon;els.mtitle.textContent=a.title;els.mdetail.textContent=a.detail;els.count.textContent=a.count;els.controls.innerHTML=a.buttons;els.sound.textContent=S.sound?'🔊 音效':'🔇 靜音';}
function openModal(type,extras={}){S.keys.clear();S.touchDirs.clear();S.goal=null;S.modal={type,...extras};root.innerHTML='';renderModal();updateUI()}
function closeModal(){S.modal=null;root.innerHTML='';updateUI()}
function renderModal(){if(!S.modal){root.innerHTML='';return}const m=S.modal;let html='';const btn=(act,txt,klass='primary')=>`<button class="${klass}" data-action="${act}">${txt}</button>`;const info=story[S.level]||story[1];

function setLevel(n){S.screen='playing';S.level=n;S.gameTime=0;S.keys.clear();S.touchDirs.clear();S.goal=null;S.winConfetti=0;S.hazardCooldown=0;S.pendingCompletion=0;if(n===1){S.player={x:145,y:355};let positions=[[278,202],[520,440],[787,170],[424,115],[846,463]];S.sheep=positions.slice(0,S.difficulty==='easy'?3:5).map((p,i)=>({id:i,x:p[0],y:p[1],homeX:p[0],homeY:p[1],following:false,rescued:false,bob:i*.9}));S.rescued=0}

function applyAction(action){const m=S.modal;if(!m)return;switch(action){case'easy':chooseDifficulty('easy');break;case'hard':chooseDifficulty('hard');break;case'begin':startGame();break;case'intro-go':closeModal();showToast('走近小羊，牠就會跟著你！');break;case'level-go':closeModal();showToast(S.level===2?'找五塊光滑的石子！':'看準時機，按下發射！');break;case'next-level':changeLevel(m.level+1);break;case'reveal':m.revealed=!m.revealed;renderModal();break;case'reveal-teacher':m.revealed=!m.revealed;renderModal();break;case'speech-go':S.timing.phase='final';S.timing.pos=.07;S.timing.dir=1;S.timing.lockedUntil=0;closeModal();showToast('觀察指標，成功區域是綠色！');break;case'restart':resetGame();break;case'menu':S.screen='menu';S.level=0;S.gameTime=0;openModal('menu');updateUI();break;case'teacher':teacher();break;case'tab-story':m.tab='story';renderModal();break;case'tab-question':m.tab='question';renderModal();break;case'tab-tools':m.tab='tools';renderModal();break;case'next-line':m.lines=Math.min(story[S.level].lines.length,(m.lines||0)+1);sound('tap');renderModal();break;case'reset-lines':m.lines=0;renderModal();break;case'hint':m.tip=S.level===1?'靠近小羊，再把牠帶到右邊的羊圈。':S.level===2?'石子表面平滑、輪廓圓潤，較合適。':'等指標進入綠色區域時按發射。';renderModal();break;case'replay-intro':openModal(S.level===1?'intro':'levelIntro',{level:S.level});break;case'assist':S.timing.assist=true;showToast('已開啟協助：指標較慢、成功範圍更闊。');renderModal();break;case'confirm-back':teacher('tools');break;case'confirm-go':if(m.target==='reset'){let n=S.level;setLevel(n);openModal('levelIntro',{level:n})}else{S.screen='menu';S.level=0;openModal('menu')}break;case'reset-confirm':openModal('confirm',{target:'reset'});break;case'menu-confirm':openModal('confirm',{target:'menu'});break;case'resume':if(m.backModal){S.modal=m.backModal;renderModal();updateUI()}else closeModal();break;}}
root.addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;e.preventDefault();sound('tap');applyAction(b.dataset.action)});

function getCanvasPos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{if(S.modal||S.screen!=='playing')return;const p=getCanvasPos(e);if(S.level===1){S.goal={x:Math.min(1200,Math.max(45,p.x)),y:Math.min(555,Math.max(105,p.y))};showToast('大衛正在走過去！')}else if(S.level===2)chooseStone(p.x,p.y);else if(S.level===3&&p.y>475)fire()});
function chooseStone(x,y){if(S.collected>=5)return;let available=S.stoneList.filter(s=>!s.selected);let s=available.find(s=>Math.hypot(s.x-x,(s.y-y)*1.2)<s.r+11);if(!s)return;if(!s.smooth){s.blink=-.5;sound('wrong');showToast('這塊石子有尖角，再觀察一下！',true);return}s.selected=true;S.collected++;S.flight.push({x:s.x,y:s.y,t:0});sound('good');showToast(`找到光滑石子！${S.collected} / 5`);updateUI()}
function fire(){if(S.level!==3||S.screen!=='playing'||S.modal)return;const t=S.timing;if(t.animation||S.gameTime<t.lockedUntil)return;const width=t.assist?.34:S.difficulty==='easy'?.26:.14,start=(1-width)/2,ok=t.pos>=start&&t.pos<=start+width;if(!ok){t.misses++;t.lockedUntil=S.gameTime+.83;sound('wrong');showToast(t.pos<start?'太早了！留意指標移到中央。':'太遲了！下一次早一點按。',true);updateUI();return}t.animation={start:S.gameTime,phase:t.phase};t.lockedUntil=Infinity;sound('fire');updateUI()}
function obstacleHit(x,y){return [[414,300,37],[637,270,40],[711,469,43],[940,375,33]].some(([ox,oy,r])=>Math.hypot(x-ox,y-oy)<r+16)}
function update(dt){if(S.modal||S.screen!=='playing')return;S.gameTime+=dt;if(S.pendingCompletion&&S.gameTime>=S.pendingCompletion){S.pendingCompletion=0;finishLevel();return}if(S.level===1)updateSheep(dt);if(S.level===2)updateStones(dt);if(S.level===3)updateTiming(dt)}
function updateSheep(dt){let dx=0,dy=0;const k=S.keys,d=S.touchDirs;if(k.has('arrowleft')||k.has('a')||d.has('left'))dx--;if(k.has('arrowright')||k.has('d')||d.has('right'))dx++;if(k.has('arrowup')||k.has('w')||d.has('up'))dy--;if(k.has('arrowdown')||k.has('s')||d.has('down'))dy++;if(!dx&&!dy&&S.goal){let vx=S.goal.x-S.player.x,vy=S.goal.y-S.player.y,dist=Math.hypot(vx,vy);if(dist<8)S.goal=null;else{dx=vx/dist;dy=vy/dist}}if(dx||dy){let len=Math.hypot(dx,dy);dx/=len;dy/=len;let speed=S.difficulty==='easy'?235:225,p=S.player;const nx=Math.min(1216,Math.max(52,p.x+dx*speed*dt)),ny=Math.min(545,Math.max(110,p.y+dy*speed*dt));if(!obstacleHit(nx,p.y))p.x=nx;if(!obstacleHit(p.x,ny))p.y=ny}
const lionX=712+Math.sin(S.gameTime*.75)*(S.difficulty==='easy'?55:100),lionY=320+Math.cos(S.gameTime*.62)*55;if(S.gameTime>S.hazardCooldown&&Math.hypot(S.player.x-lionX,S.player.y-lionY)<62){S.player={x:180,y:360};S.goal=null;S.hazardCooldown=S.gameTime+3;S.sheep.forEach(s=>{if(s.following&&!s.rescued){s.following=false;s.x=s.homeX;s.y=s.homeY}});sound('wrong');showToast('避開危險！小羊在原來的位置等你。',true)}
S.sheep.forEach((s,i)=>{if(s.rescued)return;if(!s.following&&Math.hypot(s.x-S.player.x,s.y-S.player.y)<90){s.following=true;sound('good');showToast('小羊跟著大衛了！帶牠回羊圈。')}if(s.following){const near=S.sheep.filter(s=>s.following&&!s.rescued).indexOf(s);const targetX=S.player.x-48-(near%3)*23,targetY=S.player.y+31+near*18;const dd=Math.hypot(targetX-s.x,targetY-s.y);if(dd>2){let speed=Math.min(dd,(S.difficulty==='easy'?230:210)*dt);s.x+=(targetX-s.x)/dd*speed;s.y+=(targetY-s.y)/dd*speed}if(S.player.x>1092&&S.player.y>305&&S.player.y<520){s.rescued=true;s.following=false;S.rescued++;sound('good');showToast('成功！小羊安全回家了！');updateUI();if(S.rescued===S.sheep.length){S.pendingCompletion=S.gameTime+.75}}}})}
function updateStones(dt){S.stoneList.forEach(s=>{if(s.blink>0)s.blink=Math.max(0,s.blink-dt);if(s.blink<0)s.blink=Math.min(0,s.blink+dt)});for(const f of S.flight)f.t+=dt;S.flight=S.flight.filter(f=>f.t<.9);if(S.collected===5&&S.flight.length===0)finishLevel()}
function updateTiming(dt){const t=S.timing;if(t.animation){const el=S.gameTime-t.animation.start;if(t.phase==='practice'&&el>=1.3){t.animation=null;t.practiceSuccess=true;openModal('speech');updateUI()}else if(t.phase==='final'&&el>=2.1){t.animation=null;finishLevel()}return}if(S.gameTime<t.lockedUntil)return;let duration=t.assist?5.1:(S.difficulty==='easy'?4:2.5);t.pos+=dt/duration*t.dir;if(t.pos>1){t.pos=2-t.pos;t.dir=-1}else if(t.pos<0){t.pos=-t.pos;t.dir=1}}
function paintRound(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}

function label(x,y,str,background='#fff9e7',color='#31566c',font=19){ctx.font=`900 ${font}px ui-rounded,system-ui,sans-serif`;let measure=ctx.measureText(str).width;paintRound(x-measure/2-16,y-24,measure+32,38,12,background);ctx.fillStyle=color;ctx.textAlign='center';ctx.fillText(str,x,y+2);ctx.textAlign='start'}
function drawCloud(x,y,z=1){ctx.save();ctx.globalAlpha=.65;ellipse(x,y,59*z,18*z,'#fff');circle(x-26*z,y-10*z,24*z,'#fff');circle(x+10*z,y-15*z,31*z,'#fff');circle(x+39*z,y-6*z,19*z,'#fff');ctx.restore()}
function background(kind){let isNight=kind==='final',grad=ctx.createLinearGradient(0,0,0,H);if(isNight){grad.addColorStop(0,'#9bd0d1');grad.addColorStop(.75,'#f2cb9d');grad.addColorStop(1,'#ecd3a7')}else{grad.addColorStop(0,'#9bd8e7');grad.addColorStop(.58,'#d9f2e0');grad.addColorStop(1,'#ffedb6')}ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);circle(1080,108,52,isNight?'#ffde93':'#ffeca9');drawCloud(190+Math.sin(S.gameTime*.04)*15,118,1.15);drawCloud(555,77,.68);drawCloud(895+Math.sin(S.gameTime*.07)*8,168,.79);poly([[0,357],[140,260],[280,360],[476,230],[670,353],[875,241],[1100,350],[1280,270],[1280,620],[0,620]],'#9dc7ad');poly([[0,410],[160,330],[350,404],[595,315],[840,408],[1040,326],[1280,405],[1280,H],[0,H]],'#81b698');poly([[0,480],[250,387],[570,467],[840,382],[1100,455],[1280,410],[1280,H],[0,H]],kind==='river'?'#9fd3ad':'#70aa80');ctx.fillStyle=kind==='river'?'#b6c996':'#90bc83';ctx.fillRect(0,515,W,105);for(let i=0;i<40;i++){let x=(i*137+29)%W,y=410+(i*113)%200;line([[x,y],[x+3,y-11],[x+8,y]],'#4e956b',1.5)}}
function drawDavid(x,y,scale=1,pose='idle'){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ellipse(0,44,30,9,'#355e4e55');let sway=Math.sin(S.gameTime*7)*2;line([[-10,19],[-12,43]],'#5b3f2f',8);line([[11,19],[14,43]],'#5b3f2f',8);poly([[-22,-32],[18,-34],[28,22],[-28,22]],'#db8361','#9d4b43',2);paintRound(-15,-15,30,12,4,'#9c5d4c');line([[-23,-23],[-37,4+sway]],'#c88a61',8);line([[20,-23],[35,2-sway]],'#c88a61',8);circle(0,-58,25,'#dda77b','#a6634c',2);ctx.beginPath();ctx.arc(-2,-62,25,Math.PI*1.06,Math.PI*1.93);ctx.strokeStyle='#4d332d';ctx.lineWidth=15;ctx.stroke();circle(-9,-59,2.5,'#30343b');circle(10,-59,2.5,'#30343b');ctx.beginPath();ctx.arc(1,-48,7,.2,Math.PI-.2);ctx.strokeStyle='#965d48';ctx.lineWidth=2;ctx.stroke();paintRound(-22,-40,44,7,4,'#bc9b64');if(pose==='sling'){ctx.rotate(-.12);line([[25,-25],[48,-80],[72,-78]],'#805a40',3);circle(72,-78,6,'#d1b497')}ctx.restore()}
function drawSheep(x,y,scale=1,phase=0){ctx.save();ctx.translate(x,y+Math.sin(S.gameTime*3+phase)*1.4);ctx.scale(scale,scale);ellipse(0,21,28,7,'#477b5959');line([[-17,7],[-17,26]],'#635e50',5);line([[16,7],[16,26]],'#635e50',5);for(const [a,b,r] of [[-18,-16,16],[-4,-21,19],[14,-13,17],[-20,3,14],[4,3,20]])circle(a,b,r,'#fffdf3','#d9e1dc',1.7);ellipse(26,-6,16,17,'#574f46');ellipse(21,-20,8,9,'#645950');ellipse(37,-18,8,9,'#645950');circle(32,-9,2.3,'#fff');circle(36,-9,1,'#171d22');ellipse(39,0,5,3,'#e6bc9f');ctx.restore()}
function drawRock(x,y,r=31){ellipse(x,y+13,r*1.1,r*.36,'#39725a55');poly([[x-r,y],[x-r*.5,y-r*.65],[x+r*.24,y-r*.76],[x+r,y-r*.1],[x+r*.75,y+r*.3],[x-r*.8,y+r*.33]],'#a8aaa0','#697a77',2);line([[x-r*.4,y-r*.4],[x+r*.2,y-r*.5]],'#d2d1c7',4)}
function drawLion(x,y){ctx.save();ctx.translate(x,y);ellipse(0,32,45,12,'#3f754657');line([[31,1],[56,-19],[54,-36]],'#9e6a37',8);for(let i=0;i<12;i++){const a=i*Math.PI/6;circle(Math.cos(a)*19-7,Math.sin(a)*20-9,13,'#b96f34')}ellipse(-5,-8,24,24,'#cc8845');ellipse(10,-1,18,16,'#f3c779');circle(14,-6,3,'#45372a');circle(32,-6,3,'#45372a');ellipse(26,5,6,4,'#764d30');ellipse(-19,20,15,18,'#c88440');line([[-18,19],[-19,39]],'#a66a37',11);line([[17,19],[17,39]],'#a66a37',11);ctx.restore()}
function drawFence(){paintRound(1043,284,205,239,23,'#d4b982','#fff3ce',4);paintRound(1059,311,176,187,13,'#a5c58b');for(let x=1056;x<1250;x+=25){line([[x,302],[x,504]],'#ad7748',7);circle(x,300,4,'#ffe2a5')}line([[1047,348],[1246,348]],'#c28a51',11);line([[1047,474],[1246,474]],'#c28a51',11);label(1138,274,'安全羊圈','#fff4da','#795332',18)}
function drawLevel1(){background('pasture');drawFence();const obs=[[414,300,37],[637,270,40],[711,469,43],[940,375,33]];obs.forEach(o=>drawRock(...o));let lionX=712+Math.sin(S.gameTime*.75)*(S.difficulty==='easy'?55:100),lionY=320+Math.cos(S.gameTime*.62)*55;circle(lionX,lionY,57,'#dca84d4c','#e3a74f',3);drawLion(lionX,lionY);S.sheep.forEach(s=>{if(s.rescued){drawSheep(1096+((s.id%3)*54),398+Math.floor(s.id/3)*46,.65,s.bob)}else{drawSheep(s.x,s.y,.84,s.bob);if(s.following)label(s.x,s.y-58,'跟著大衛','#ffedab','#5b603b',13)}});drawDavid(S.player.x,S.player.y,1.04);if(S.goal){circle(S.goal.x,S.goal.y,10,'#fce79cbb','#f6dc69',3)}ctx.fillStyle='#fff3';paintRound(20,570,370,33,13,'#fff9dfa8');ctx.font='800 18px system-ui';ctx.fillStyle='#3c7959';ctx.fillText('找到小羊 → 帶到畫面右邊的羊圈',38,593)}
function drawStone(s){if(s.selected)return;let {x,y,r,smooth,seed}=s;ellipse(x,y+r*.35,r*1.05,r*.37,'#277a8975');ctx.save();ctx.translate(x,y);let fill=smooth?'#b9b4a2':'#959c9c',stroke=smooth?'#7d857b':'#697f82';ctx.beginPath();if(smooth){ctx.ellipse(0,0,r*(.98+(seed%3)*.04),r*.72,seed*.2,0,Math.PI*2)}else{let vertices=8;for(let i=0;i<vertices;i++){let a=-Math.PI/2+i/vertices*Math.PI*2, rr=r*(i%2===0?1.0:.73);let px=Math.cos(a)*rr,py=Math.sin(a)*rr*.85;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke();ellipse(-r*.22,-r*.19,r*.3,r*.14,'#ffffff88',-.4);if(s.blink>0){circle(0,0,r+11,'#00000000','#ffed73',6)}if(s.blink<0){line([[-14,-10],[14,10]],'#bf5858',5);line([[14,-10],[-14,10]],'#bf5858',5)}ctx.restore()}
function drawLevel2(){background('river');poly([[0,110],[320,140],[790,115],[1050,0],[1280,0],[1280,620],[980,620],[760,560],[360,590],[0,534]],'#c7a67e');poly([[0,164],[350,193],[785,159],[990,60],[1280,52],[1280,592],[984,578],[797,518],[350,541],[0,489]],'#7dcccf','#a3edeb',6);for(let j=0;j<14;j++){const yy=150+j*31;line([[80+(j*83)%220,yy],[212+(j*83)%300,yy-7]],'#e0ffff8b',5);line([[635+(j*117)%280,yy+23],[733+(j*93)%340,yy+18]],'#e0ffff64',3)}S.stoneList.forEach(drawStone);drawDavid(1109,337,.94);ellipse(1088,498,82,15,'#42888055');paintRound(1043,413,99,117,22,'#a47348','#704e36',4);line([[1046,425],[1139,425]],'#8e5e35',6);line([[1053,426],[1072,384],[1125,384],[1140,426]],'#784e2e',8);for(let i=0;i<S.collected;i++)circle(1070+(i%3)*23,446+Math.floor(i/3)*24,11,'#d3c9a5','#877e6c',2);label(1094,567,`牧人袋子 ${S.collected}/5`,'#fff4dd','#72573a',19);S.flight.forEach(f=>{const t=Math.min(1,f.t/.68),e=t*t*(3-2*t);circle(f.x+(1085-f.x)*e,f.y+(462-f.y)*e,15,'#d9cbaa','#8f8a75',2)})}
function drawTarget(x,y){line([[x,y-75],[x,y+139]],'#71482f',23);circle(x,y-85,94,'#b57950','#66482d',9);circle(x,y-85,71,'#fff0d0','#af683d',5);circle(x,y-85,47,'#ce8b70','#a35d4a',4);circle(x,y-85,23,'#f5d19b','#d5b07d',4);circle(x,y-85,6,'#795b45')}
function drawGoliath(x,y,fall=0){ctx.save();ctx.translate(x,y);ctx.rotate(fall*.93);ellipse(0,160,93,17,'#375a5155');line([[-35,77],[-44,151]],'#8b7668',24);line([[35,80],[43,151]],'#8b7668',24);paintRound(-72,-22,143,114,15,'#bd8b68','#695f5b',5);paintRound(-67,-7,134,52,8,'#d7b26e');for(let j=-42;j<=42;j+=21)circle(j,18,6,'#9e8655');line([[-70,5],[-113,72]],'#b88e6a',19);line([[72,5],[116,70]],'#b88e6a',19);circle(0,-75,56,'#c89477','#8b6751',4);poly([[-60,-99],[-30,-149],[23,-157],[63,-103],[47,-88],[-50,-89]],'#87888c','#62636a',5);circle(-18,-76,5,'#302b2b');circle(20,-76,5,'#302b2b');line([[-18,-43],[18,-43]],'#774c41',4);paintRound(-83,-31,166,23,6,'#9a6746');ctx.restore()}
function drawLevel3(){background('final');poly([[0,506],[200,467],[390,491],[520,462],[708,505],[900,467],[1100,504],[1280,479],[1280,H],[0,H]],'#c5b28c');drawRock(400,425,22);drawRock(666,389,27);drawRock(1170,462,38);drawDavid(233,394,1.85,'sling');const t=S.timing;let elapsed=t.animation?S.gameTime-t.animation.start:-1;let fall=t.animation&&t.phase==='final'?Math.min(1,Math.max(0,(elapsed-.65)/1.1)):0;if(t.phase==='practice')drawTarget(1016,338);else drawGoliath(1032,307,fall);if(t.animation){let pr=Math.max(0,Math.min(1,elapsed/(t.phase==='practice'?.88:.8)));let sx=305,sy=274,ex=1005,ey=t.phase==='practice'?246:225;ellipse(sx+(ex-sx)*pr,sy+(ey-sy)*pr-80*Math.sin(Math.PI*pr),11,11,'#766b64');for(let i=1;i<=3;i++){let z=Math.max(0,pr-i*.04);if(z>0)circle(sx+(ex-sx)*z,sy+(ey-sy)*z-80*Math.sin(Math.PI*z),5,'#ffffff72')}if(elapsed>1){label(635,203,t.phase==='practice'?'🎯 擊中木靶！':'✨ 大衛得勝了！','#fff2cd','#62493a',30)}}
const x=285,y=516,w=720,h=36,width=t.assist?.34:S.difficulty==='easy'?.26:.14,left=(1-width)/2;paintRound(x-13,y-44,w+26,103,22,'#203e4add','#ffffdc',2);ctx.font='900 21px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.fillText(t.phase==='practice'?'練習：把握時機，擊中木靶':'正式挑戰：等待最佳發射時機',645,y-13);ctx.textAlign='start';paintRound(x,y,w,h,13,'#d78d82');ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,13);ctx.clip();ctx.fillStyle='#79ce8b';ctx.fillRect(x+w*left,y,w*width,h);for(let i=0;i<w;i+=24){ctx.fillStyle='#ffffff13';ctx.fillRect(x+i,y,7,h)}ctx.restore();ctx.lineWidth=3;ctx.strokeStyle='#ffffffc9';ctx.beginPath();ctx.roundRect(x,y,w,h,13);ctx.stroke();let px=x+w*t.pos;poly([[px-14,y-7],[px+14,y-7],[px,y+8]],'#fff2c8','#785c3a',2);ellipse(px,y+36,6,5,'#fffde7');ctx.font='800 17px system-ui';ctx.fillStyle='#fff8e7';ctx.textAlign='center';ctx.fillText('太早',x+45,y+65);ctx.fillText('最佳時機',x+w/2,y+65);ctx.fillText('太遲',x+w-45,y+65);ctx.textAlign='start'}
function drawMenu(){background('pasture');drawFence();drawSheep(1057,415,1.1,1);drawSheep(1160,440,.9,2);drawRock(520,470,35);drawGoliath(990,300,.0);drawDavid(285,417,2,'sling');ellipse(647,547,250,30,'#124a4633');ctx.font='950 42px ui-rounded,system-ui';ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#fff5d8';ctx.strokeText('勇敢，不只是靠力氣',640,282);ctx.fillStyle='#2d604f';ctx.fillText('勇敢，不只是靠力氣',640,282);ctx.font='900 25px ui-rounded,system-ui';ctx.strokeStyle='#fff5d8';ctx.lineWidth=7;ctx.strokeText('你準備好踏上冒險了嗎？',638,325);ctx.fillStyle='#56683f';ctx.fillText('你準備好踏上冒險了嗎？',638,325);ctx.textAlign='start'}
function frame(t){if(!S.lastFrame)S.lastFrame=t;const dt=Math.min((t-S.lastFrame)/1000,.045);S.lastFrame=t;update(dt);ctx.clearRect(0,0,W,H);if(S.screen==='menu'){drawMenu()}else if(S.level===1){drawLevel1()}else if(S.level===2){drawLevel2()}else if(S.level===3){drawLevel3()}else drawMenu();requestAnimationFrame(frame)}
function init(){updateUI();openModal('menu');const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=W*ratio;canvas.height=H*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);requestAnimationFrame(frame)}
init();
})();
